name: docker-release
on:
  push:
    tags: ['v*.*.*']
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 解析版本标签
        id: ver
        run: |
          tag=${GITHUB_REF_NAME}
          major_minor=$(echo $tag | sed 's/\.[^.]*$//')
          echo "major_minor=$major_minor" >> $GITHUB_OUTPUT
      - name: 构建推送 admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            xxljob/xxl-job-admin:latest
            xxljob/xxl-job-admin:${{ github.ref_name }}
            xxljob/xxl-job-admin:${{ steps.ver.outputs.major_minor }}
      - name: 构建推送 executor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/cmd/executor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            xxljob/xxl-job-executor:latest
            xxljob/xxl-job-executor:${{ github.ref_name }}
            xxljob/xxl-job-executor:${{ steps.ver.outputs.major_minor }}
