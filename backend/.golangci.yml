version: "2"

run:
  timeout: 5m
  go: '1.25'

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - nakedret
  formatters:
    enable:
      - gofmt
      - goimports
  settings:
    goimports:
      local-prefixes:
        - xxl-job-admin-go
    revive:
      rules:
        - name: exported
          disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gocritic]
      - path: internal/gen
        linters: [all]
