syntax = "proto3";

package xxl.v1;

option go_package = "xxl-job-admin-go/pkg/gen/xxl/v1;xxlv1";

// 通用返回结构
message ReturnT {
  int32  code    = 1;  // 200=成功
  string msg     = 2;
  string content = 3;
}

// 触发任务请求（admin → executor）
message TriggerTask {
  int64              job_id              = 1;
  string             executor_handler    = 2;
  string             executor_params     = 3;
  string             executor_block_strategy = 4;
  int32              executor_timeout    = 5;  // 秒
  int64              log_id              = 6;  // 本次调度日志 ID
  int64              log_date_time       = 7;
  int32              shard_index         = 8;
  int32              shard_total         = 9;
  map<string, string> ext                = 10;
  int32              glue_type           = 11; // 0=BEAN 1=GLUE(Go, yaegi)
  string             glue_source         = 12; // GLUE 代码（glue_type!=0 时有效）
}

// 任务执行结果（executor → admin）
message TaskResult {
  int64  log_id      = 1;
  int32  handle_code = 2;  // 200=成功
  string handle_msg  = 3;
  int64  handle_time = 4;
}

// 日志块（流式推送）
message LogChunk {
  int64  log_id      = 1;
  int64  from_line   = 2;
  int64  to_line     = 3;
  bytes  log_content = 4;  // 原始日志字节
  bool   end         = 5;
}

// 负载上报（executor → admin，路由依据）
message LoadReport {
  int32  active_tasks = 1;
  double cpu_usage    = 2;
  int32  queue_depth  = 3;
}
