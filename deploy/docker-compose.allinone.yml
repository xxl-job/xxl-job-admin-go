# All-in-One 体验配置：mysql + admin（内嵌通用执行器，2 容器）。
# 体验/试用用，一条命令起来：JWT_SECRET=xxx docker compose -f deploy/docker-compose.allinone.yml up
# 生产请用 docker-compose.yml（mysql + admin + 独立 executor，3 容器）。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xxl_job
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin:
    image: xxljob/xxl-job-admin:latest
    restart: unless-stopped
    # -executor：admin 进程内嵌通用执行器（注册 httpCall/shellExec/mysqlQuery/sendWebhook），
    # 免去单独部署 executor 容器，开箱即可调度上述 handler 的 BEAN 任务。
    command: ["./xxl-job-admin-go", "-executor"]
    environment:
      DB_DSN: "root:root@tcp(mysql:3306)/xxl_job?charset=utf8mb4&parseTime=True&loc=Local"
      SERVER_HTTP_ADDR: ":8080"
      SERVER_GRPC_ADDR: ":9090"
      JWT_SECRET: "${JWT_SECRET:?请通过环境变量或 .env 设置强 JWT_SECRET（≥16 字节）}"
      APP_NAME: "default"
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
