services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xxl_job
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin:
    image: xxljob/xxl-job-admin:latest
    restart: unless-stopped
    environment:
      DB_DSN: "root:root@tcp(mysql:3306)/xxl_job?charset=utf8mb4&parseTime=True&loc=Local"
      SERVER_HTTP_ADDR: ":8080"
      SERVER_GRPC_ADDR: ":9090"
      JWT_SECRET: "${JWT_SECRET:?请通过环境变量或 .env 设置强 JWT_SECRET（≥16 字节）}"
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      mysql:
        condition: service_healthy

  executor:
    image: xxljob/xxl-job-executor:latest
    restart: unless-stopped
    environment:
      ADMIN_ADDR: http://admin:9090
      APP_NAME: default
    depends_on:
      - admin

volumes:
  mysql_data:
